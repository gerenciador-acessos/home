<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-wp="void">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Página</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
/* ───────────── RESET ───────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;scroll-behavior:smooth}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}

/* ───────────── TOKENS ───────────── */
:root{
  --bg:#080810;
  --s1:#111120;
  --s2:#191929;
  --s3:#222236;
  --b1:rgba(255,255,255,0.055);
  --b2:rgba(255,255,255,0.11);
  --b3:rgba(255,255,255,0.22);
  --t1:#e2e2f2;
  --t2:#8888aa;
  --t3:#3e3e58;
  --a:#7c6dfa;
  --a2:#b09df8;
  --ag:rgba(124,109,250,0.16);
  --ah:rgba(124,109,250,0.28);
  --red:#f87171;
  --redbg:rgba(248,113,113,0.1);
  --amber:#fbbf24;
  --amberbg:rgba(251,191,36,0.1);
  --green:#4ade80;
  --font:'Outfit',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --r:12px;--rs:8px;--rl:18px;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --card-h:96px;
}
[data-theme="light"]{
  --bg:#eeeef8;
  --s1:#ffffff;
  --s2:#f5f5fc;
  --s3:#ebebf5;
  --b1:rgba(0,0,0,0.07);
  --b2:rgba(0,0,0,0.13);
  --b3:rgba(0,0,0,0.22);
  --t1:#18182a;
  --t2:#66668a;
  --t3:#b0b0cc;
  --ag:rgba(124,109,250,0.09);
  --ah:rgba(124,109,250,0.18);
  --shadow:0 4px 20px rgba(0,0,0,0.1);
}

/* ───────────── WALLPAPERS ───────────── */
html{background:var(--bg);transition:background 0.4s}
html[data-wp="void"]{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 65% 45% at 12% 8%,rgba(100,80,255,0.09) 0%,transparent 60%),
    radial-gradient(ellipse 45% 35% at 88% 85%,rgba(160,100,255,0.06) 0%,transparent 55%);
}
html[data-wp="aurora"]{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 50% at 10% 15%,rgba(0,220,160,0.09) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 80%,rgba(0,170,255,0.07) 0%,transparent 55%);
}
html[data-wp="sunset"]{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 65% 45% at 20% 10%,rgba(255,120,50,0.1) 0%,transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 80%,rgba(230,60,120,0.08) 0%,transparent 55%);
}
html[data-wp="ocean"]{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 70% 50% at 5% 20%,rgba(0,100,255,0.1) 0%,transparent 60%),
    radial-gradient(ellipse 55% 40% at 90% 75%,rgba(0,200,220,0.07) 0%,transparent 55%);
}
html[data-wp="nebula"]{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 60% 40% at 20% 15%,rgba(220,60,180,0.09) 0%,transparent 55%),
    radial-gradient(ellipse 50% 35% at 75% 80%,rgba(80,160,255,0.08) 0%,transparent 50%),
    radial-gradient(ellipse 40% 30% at 55% 40%,rgba(255,180,0,0.04) 0%,transparent 45%);
}

/* ───────────── LAYOUT ───────────── */
body{font-family:var(--font);color:var(--t1);min-height:100vh}
.page{max-width:860px;margin:0 auto;padding:36px 20px 80px}

/* ───────────── HEADER ───────────── */
.header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:36px;
}
.brand{
  font-size:12px;font-weight:500;color:var(--t3);
  text-transform:uppercase;letter-spacing:0.1em;font-family:var(--mono);
}
.header-right{display:flex;align-items:center;gap:12px}
#weather{
  font-size:13px;color:var(--t2);font-family:var(--mono);
  display:flex;align-items:center;gap:5px;
}
#weather.loading{
  width:80px;height:14px;background:var(--s2);border-radius:4px;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%,100%{opacity:0.4}50%{opacity:0.8}}
.clock{font-size:13px;color:var(--t3);font-family:var(--mono)}
.icon-btn{
  width:34px;height:34px;border-radius:var(--rs);
  border:1px solid var(--b1);background:var(--s1);
  color:var(--t2);font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:background .15s,border-color .15s,color .15s;
}
.icon-btn:hover{background:var(--s2);border-color:var(--b2);color:var(--t1)}

/* ───────────── SEARCH ───────────── */
.search-wrap{margin-bottom:32px}
.search-field-wrap{position:relative;flex:1}
.search-row{display:flex;gap:8px}
.s-icon{
  position:absolute;left:15px;top:50%;transform:translateY(-50%);
  color:var(--t3);pointer-events:none;
}
.search-input{
  width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);
  padding:13px 16px 13px 44px;font-size:15px;font-weight:400;
  color:var(--t1);outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.search-input::placeholder{color:var(--t3)}
.search-input:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--ag)}
.search-btn{
  padding:13px 22px;border-radius:var(--r);border:1px solid var(--b1);
  background:var(--s1);color:var(--t2);font-size:13px;font-weight:500;
  transition:all .15s;white-space:nowrap;
}
.search-btn:hover{background:var(--s2);border-color:var(--b2);color:var(--t1)}
.engine-row{display:flex;gap:5px;margin-top:9px;padding-left:2px}
.eng-btn{
  padding:4px 13px;border-radius:20px;border:1px solid transparent;
  background:transparent;color:var(--t3);font-size:12px;transition:all .15s;
}
.eng-btn.active{border-color:var(--b1);background:var(--s1);color:var(--t2)}
.eng-btn:hover{color:var(--t2)}

/* Suggestions */
.suggestions{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--s1);border:1px solid var(--b2);border-radius:var(--r);
  box-shadow:var(--shadow);z-index:50;overflow:hidden;display:none;
}
.suggestions.show{display:block}
.sug-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  cursor:pointer;transition:background .12s;border-bottom:1px solid var(--b1);
}
.sug-item:last-child{border-bottom:none}
.sug-item:hover{background:var(--s2)}
.sug-fav{width:20px;height:20px;border-radius:5px;object-fit:cover;flex-shrink:0}
.sug-info{min-width:0}
.sug-name{font-size:13px;font-weight:500;color:var(--t1)}
.sug-url{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-visits{
  margin-left:auto;font-size:10px;color:var(--t3);
  font-family:var(--mono);flex-shrink:0;
}

/* ───────────── CONTROLS BAR ───────────── */
.controls-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;gap:8px;
}
.cat-tabs{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.cat-btn{
  padding:5px 14px;border-radius:20px;border:1px solid var(--b1);
  background:transparent;color:var(--t3);font-size:12px;font-weight:500;
  transition:all .15s;
}
.cat-btn:hover{color:var(--t2);border-color:var(--b2)}
.cat-btn.active{background:var(--a);border-color:var(--a);color:#fff}
.cat-btn.hot{border-color:var(--amberbg);color:var(--amber)}
.cat-btn.hot.active{background:var(--amber);border-color:var(--amber);color:#000}
.view-tog{
  padding:5px 12px;border-radius:20px;border:1px solid var(--b1);
  background:transparent;color:var(--t3);font-size:12px;font-weight:500;
  transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.view-tog:hover{color:var(--t2);border-color:var(--b2)}
.view-tog.active{border-color:var(--b2);color:var(--t2);background:var(--s2)}

/* ───────────── CONTENT ───────────── */
#content{}

/* Section header */
.sec-header{
  display:flex;align-items:center;justify-content:space-between;
  margin:24px 0 10px;cursor:pointer;user-select:none;
}
.sec-header:first-child{margin-top:0}
.sec-name{
  font-size:11px;font-weight:500;color:var(--t3);
  text-transform:uppercase;letter-spacing:0.1em;font-family:var(--mono);
}
.sec-arrow{
  font-size:12px;color:var(--t3);
  transition:transform .2s;
}
.sec-collapsed .sec-arrow{transform:rotate(-90deg)}
.sec-collapsed .grid{display:none}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(116px,1fr));
  gap:9px;
  margin-bottom:4px;
}

/* Card */
.site-card{
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);
  padding:16px 10px 12px;display:flex;flex-direction:column;
  align-items:center;gap:7px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .12s,box-shadow .15s;
  position:relative;user-select:none;min-height:var(--card-h);
  animation:cardIn .3s ease both;
  animation-delay:calc(var(--i,0) * 35ms);
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(10px) scale(0.97)}
  to{opacity:1;transform:none}
}
.site-card:hover{
  border-color:var(--b2);background:var(--s2);
  transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,0.25);
}
.site-card.favorite{
  grid-column:span 2;
  flex-direction:row;justify-content:flex-start;padding:14px 16px;
  background:linear-gradient(135deg, var(--s1), var(--s2));
}
.site-card.favorite .site-name{text-align:left;max-width:none;flex:1}
.site-card.favorite .fav-wrap{width:40px;height:40px;border-radius:11px}
.site-card.favorite .fav-wrap img{width:36px;height:36px}
.site-card.favorite .favicon-fb{width:40px;height:40px;font-size:15px}
.site-card:hover .card-actions{opacity:1}

/* Card favicon */
.fav-wrap{
  width:36px;height:36px;border-radius:10px;
  overflow:hidden;background:var(--s2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.fav-wrap img{width:32px;height:32px;object-fit:cover}
.favicon-fb{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--s2),var(--s3));
  border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--a2);font-family:var(--mono);flex-shrink:0;
}
.site-name{
  font-size:12px;color:var(--t2);text-align:center;
  max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;
}
.visit-badge{
  position:absolute;top:5px;left:7px;
  font-size:9px;font-family:var(--mono);color:var(--t3);
}
.visit-badge.has-visits{color:var(--amber)}

/* Card action buttons */
.card-actions{
  position:absolute;top:4px;right:4px;
  display:flex;gap:3px;opacity:0;transition:opacity .15s;
}
.ca-btn{
  width:22px;height:22px;border-radius:6px;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:background .15s;
  flex-shrink:0;
}
.ca-del{background:var(--redbg);color:var(--red)}
.ca-del:hover{background:rgba(248,113,113,0.22)}
.ca-edit{background:var(--s3);color:var(--t2)}
.ca-edit:hover{background:var(--b2);color:var(--t1)}
.ca-star{background:var(--amberbg);color:var(--amber)}
.ca-star:hover{background:rgba(251,191,36,0.22)}
.ca-star.starred{background:var(--amber);color:#000}

/* Drag ghost */
.sortable-ghost{opacity:0.3;background:var(--ag)!important;border-color:var(--a)!important}
.sortable-drag{box-shadow:0 12px 40px rgba(0,0,0,0.5)!important}

/* Add card */
.add-card{
  background:transparent;border:1px dashed var(--b2);border-radius:var(--r);
  padding:16px 10px 12px;display:flex;flex-direction:column;
  align-items:center;gap:7px;cursor:pointer;
  transition:border-color .15s,background .15s;min-height:var(--card-h);
}
.add-card:hover{border-color:var(--a);background:var(--ag)}
.add-icon{
  width:36px;height:36px;border-radius:10px;background:var(--s2);
  border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--t3);transition:color .15s;line-height:1;
}
.add-card:hover .add-icon{color:var(--a2)}
.add-card span{font-size:12px;color:var(--t3)}
.add-card:hover span{color:var(--a2)}

/* Empty state */
.empty{
  padding:48px 24px;text-align:center;
  color:var(--t3);font-size:14px;
}
.empty-icon{font-size:32px;margin-bottom:10px}

/* ───────────── SETTINGS DRAWER ───────────── */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  backdrop-filter:blur(3px);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.drawer-overlay.open{opacity:1;pointer-events:all}
.drawer{
  position:fixed;top:0;right:-340px;width:300px;height:100vh;
  background:var(--s1);border-left:1px solid var(--b2);
  z-index:201;padding:0;overflow-y:auto;
  transition:right .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.open{right:0}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 16px;border-bottom:1px solid var(--b1);position:sticky;top:0;
  background:var(--s1);z-index:1;
}
.drawer-head-title{font-size:14px;font-weight:600;color:var(--t1)}
.drawer-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:24px}
.dw-section{}
.dw-label{
  font-size:10px;font-weight:500;color:var(--t3);
  text-transform:uppercase;letter-spacing:0.1em;
  font-family:var(--mono);margin-bottom:10px;
}
.theme-toggle-row{display:flex;gap:6px}
.theme-btn{
  flex:1;padding:9px;border-radius:var(--rs);border:1px solid var(--b1);
  background:transparent;color:var(--t2);font-size:13px;font-weight:500;
  transition:all .15s;
}
.theme-btn:hover{background:var(--s2);border-color:var(--b2)}
.theme-btn.active{background:var(--a);border-color:var(--a);color:#fff}
.wp-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wp-swatch{
  aspect-ratio:1;border-radius:var(--rs);cursor:pointer;
  border:2px solid transparent;transition:transform .15s,border-color .15s;
  position:relative;overflow:hidden;
}
.wp-swatch:hover{transform:scale(1.08)}
.wp-swatch.active{border-color:var(--a)}
.wp-swatch::after{
  content:attr(data-label);
  position:absolute;bottom:0;left:0;right:0;
  font-size:8px;font-family:var(--mono);text-align:center;
  padding:2px 0;background:rgba(0,0,0,0.5);color:#fff;
}
.wp-void{background:linear-gradient(135deg,#0f0f18,#1a1030)}
.wp-aurora{background:linear-gradient(135deg,#071a14,#0a1a2a)}
.wp-sunset{background:linear-gradient(135deg,#1a0a08,#1a0818)}
.wp-ocean{background:linear-gradient(135deg,#05101f,#071522)}
.wp-nebula{background:linear-gradient(135deg,#150814,#0a1020)}
.dw-btn{
  width:100%;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--b1);
  background:var(--s2);color:var(--t2);font-size:13px;font-weight:500;
  text-align:left;transition:all .15s;display:flex;align-items:center;gap:8px;
  margin-bottom:6px;
}
.dw-btn:hover{background:var(--s3);border-color:var(--b2);color:var(--t1)}
.dw-btn.danger{color:var(--red)}
.dw-btn.danger:hover{background:var(--redbg);border-color:var(--red)}
.dw-stats{
  background:var(--s2);border-radius:var(--rs);padding:12px 14px;
  font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:5px;
}
.dw-stat-row{display:flex;justify-content:space-between}
.dw-stat-val{color:var(--t1);font-family:var(--mono)}

/* ───────────── MODAL ───────────── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.55);backdrop-filter:blur(5px);
  z-index:300;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal{
  background:var(--s1);border:1px solid var(--b2);border-radius:var(--rl);
  padding:28px;width:100%;max-width:380px;
  animation:modalIn .22s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes modalIn{
  from{opacity:0;transform:scale(.94) translateY(10px)}
  to{opacity:1;transform:none}
}
.modal-hd{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;
}
.modal-title{font-size:15px;font-weight:600;color:var(--t1)}
.fg{margin-bottom:14px}
.fg label{
  display:block;font-size:11px;font-weight:500;color:var(--t3);
  text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono);margin-bottom:6px;
}
.fi{
  width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:var(--rs);
  padding:10px 14px;font-size:14px;color:var(--t1);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.fi::placeholder{color:var(--t3)}
.fi:focus{border-color:var(--a);box-shadow:0 0 0 3px var(--ag)}
.cat-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cat-chip{
  padding:3px 10px;border-radius:20px;background:var(--s3);
  border:1px solid var(--b1);color:var(--t2);font-size:11px;cursor:pointer;
  transition:all .12s;
}
.cat-chip:hover{background:var(--ag);border-color:var(--a);color:var(--a2)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.btn-cancel{
  padding:9px 18px;border-radius:var(--rs);border:1px solid var(--b1);
  background:transparent;color:var(--t2);font-size:13px;font-weight:500;
  transition:all .15s;
}
.btn-cancel:hover{background:var(--s2)}
.btn-save{
  padding:9px 20px;border-radius:var(--rs);border:1px solid var(--a);
  background:var(--a);color:#fff;font-size:13px;font-weight:600;
  transition:all .15s;
}
.btn-save:hover{background:var(--a2);border-color:var(--a2)}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--s1);border:1px solid var(--b2);border-radius:var(--r);
  padding:10px 18px;font-size:13px;color:var(--t1);
  box-shadow:var(--shadow);z-index:500;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ───────────── SCROLL ───────────── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--b3)}

/* ───────────── RESPONSIVE ───────────── */
@media(max-width:480px){
  .page{padding:24px 14px 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .site-card.favorite{grid-column:span 1;flex-direction:column;padding:16px 10px 12px}
  .drawer{width:280px}
}
</style>
</head>
<body>

<!-- ── DRAWER OVERLAY ── -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- ── SETTINGS DRAWER ── -->
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span class="drawer-head-title">⚙ Configurações</span>
    <button class="icon-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body">

    <div class="dw-section">
      <div class="dw-label">Tema</div>
      <div class="theme-toggle-row">
        <button class="theme-btn active" id="btnDark" onclick="setTheme('dark')">🌙 Escuro</button>
        <button class="theme-btn" id="btnLight" onclick="setTheme('light')">☀️ Claro</button>
      </div>
    </div>

    <div class="dw-section">
      <div class="dw-label">Plano de Fundo</div>
      <div class="wp-swatches">
        <div class="wp-swatch wp-void active" data-wp="void" data-label="Void" onclick="setWp(this)"></div>
        <div class="wp-swatch wp-aurora" data-wp="aurora" data-label="Aurora" onclick="setWp(this)"></div>
        <div class="wp-swatch wp-sunset" data-wp="sunset" data-label="Sunset" onclick="setWp(this)"></div>
        <div class="wp-swatch wp-ocean" data-wp="ocean" data-label="Ocean" onclick="setWp(this)"></div>
        <div class="wp-swatch wp-nebula" data-wp="nebula" data-label="Nebula" onclick="setWp(this)"></div>
      </div>
    </div>

    <div class="dw-section">
      <div class="dw-label">Dados</div>
      <button class="dw-btn" onclick="exportData()">⬇ Exportar JSON</button>
      <button class="dw-btn" onclick="document.getElementById('importFile').click()">⬆ Importar JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
      <button class="dw-btn danger" onclick="resetData()">🔄 Restaurar padrão</button>
    </div>

    <div class="dw-section">
      <div class="dw-label">Estatísticas</div>
      <div class="dw-stats" id="statsBox"></div>
    </div>

  </div>
</div>

<!-- ── PAGE ── -->
<div class="page">

  <!-- Header -->
  <header class="header">
    <span class="brand">minha página</span>
    <div class="header-right">
      <div id="weather"></div>
      <div id="clock" class="clock"></div>
      <button class="icon-btn" onclick="toggleDrawer()" title="Configurações">⚙</button>
    </div>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-row">
      <div class="search-field-wrap">
        <svg class="s-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="searchInput"
               placeholder="Pesquisar ou abrir site..." autocomplete="off"
               oninput="updateSuggestions()" onkeydown="handleSearchKey(event)" />
        <div class="suggestions" id="suggestions"></div>
      </div>
      <button class="search-btn" onclick="doSearch()">Buscar</button>
    </div>
    <div class="engine-row">
      <button class="eng-btn active" onclick="setEngine(this,'https://google.com/search?q=')">Google</button>
      <button class="eng-btn" onclick="setEngine(this,'https://youtube.com/results?search_query=')">YouTube</button>
      <button class="eng-btn" onclick="setEngine(this,'https://bing.com/search?q=')">Bing</button>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <div class="cat-tabs" id="catTabs"></div>
    <button class="view-tog" id="viewTogBtn" onclick="toggleView()">☰ Seções</button>
  </div>

  <!-- Content -->
  <div id="content"></div>
</div>

<!-- ── ADD/EDIT MODAL ── -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-hd">
      <span class="modal-title" id="modalTitle">Adicionar site</span>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="fg">
      <label>Nome</label>
      <input class="fi" id="fName" placeholder="Ex: Meu Site" />
    </div>
    <div class="fg">
      <label>URL</label>
      <input class="fi" id="fUrl" placeholder="https://exemplo.com.br" />
    </div>
    <div class="fg">
      <label>Categoria</label>
      <input class="fi" id="fCat" placeholder="Ex: Trabalho, Social..." />
      <div class="cat-chips" id="catChips"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveModal()">Salvar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
const SK = 'minha_pagina_v3';
let editingId = null;
let activeCategory = 'Todos';
let viewMode = 'grid'; // 'grid' | 'sections'
let searchEngine = 'https://google.com/search?q=';
let activeSortables = [];
let sugFocus = -1;

const DEFAULTS = [
  {name:'Google',       url:'https://google.com',            cat:'Busca'},
  {name:'YouTube',      url:'https://youtube.com',           cat:'Vídeos'},
  {name:'Gmail',        url:'https://mail.google.com',       cat:'Email'},
  {name:'WhatsApp Web', url:'https://web.whatsapp.com',      cat:'Social'},
  {name:'Facebook',     url:'https://facebook.com',          cat:'Social'},
  {name:'Instagram',    url:'https://instagram.com',         cat:'Social'},
  {name:'MercadoLivre', url:'https://mercadolivre.com.br',   cat:'Compras'},
  {name:'Outlook',      url:'https://outlook.com',           cat:'Email'},
  {name:'G1',           url:'https://g1.globo.com',          cat:'Notícias'},
  {name:'UOL',          url:'https://uol.com.br',            cat:'Notícias'},
  {name:'Banco do Brasil',url:'https://bb.com.br',           cat:'Bancos'},
  {name:'Caixa Federal',url:'https://caixa.gov.br',          cat:'Bancos'},
  {name:'Bradesco',     url:'https://bradesco.com.br',       cat:'Bancos'},
  {name:'Drive',        url:'https://drive.google.com',      cat:'Trabalho'},
  {name:'Globo.com',    url:'https://globo.com',             cat:'Notícias'},
].map(s => ({...s, id: uid(), visits: 0, favorite: false}));

function loadState() {
  try {
    const raw = localStorage.getItem(SK);
    if (raw) {
      const s = JSON.parse(raw);
      if (!Array.isArray(s.sites)) return null;
      s.sites = s.sites.map(x => ({visits:0,favorite:false,...x}));
      return s;
    }
  } catch(e) {}
  return null;
}

let state = loadState() || {
  sites: DEFAULTS,
  settings: {theme:'dark', wp:'void'}
};

function saveState() {
  localStorage.setItem(SK, JSON.stringify(state));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

/* ══════════════════════════════════════════
   FAVICON
══════════════════════════════════════════ */
function getDomain(url) {
  try { return new URL(url.startsWith('http') ? url : 'https://'+url).hostname; }
  catch(e) { return ''; }
}

function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0,2);
}

function buildFavicon(site, size = 32) {
  const domain = getDomain(site.url);
  const wrap = document.createElement('div');
  wrap.className = 'fav-wrap';

  const img = document.createElement('img');
  img.width = size; img.height = size;
  img.alt = site.name;

  let tried = 0;
  const sources = [
    `https://logo.clearbit.com/${domain}`,
    `https://www.google.com/s2/favicons?domain=${domain}&sz=64`,
  ];

  function tryNext() {
    if (tried >= sources.length) {
      wrap.remove();
      const fb = document.createElement('div');
      fb.className = 'favicon-fb';
      fb.textContent = initials(site.name);
      return fb;
    }
    img.src = sources[tried++];
    return null;
  }

  img.onerror = function() {
    const fb = tryNext();
    if (fb) {
      wrap.replaceWith(fb);
    }
  };

  img.src = sources[tried++];
  wrap.appendChild(img);
  return wrap;
}

function buildFaviconSmall(site) {
  const domain = getDomain(site.url);
  const img = document.createElement('img');
  img.className = 'sug-fav';
  img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
  img.onerror = () => { img.style.display = 'none'; };
  return img;
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function getCategories() {
  return ['Todos', ...new Set(state.sites.map(s => s.cat).filter(Boolean)), 'Mais Visitados'];
}

function renderTabs() {
  const bar = document.getElementById('catTabs');
  bar.innerHTML = '';
  getCategories().forEach(cat => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (cat === activeCategory ? ' active' : '') + (cat === 'Mais Visitados' ? ' hot' : '');
    b.textContent = cat;
    b.onclick = () => { activeCategory = cat; renderTabs(); renderContent(); };
    bar.appendChild(b);
  });

  const vb = document.getElementById('viewTogBtn');
  vb.classList.toggle('active', viewMode === 'sections');
  vb.textContent = viewMode === 'sections' ? '⊞ Grade' : '☰ Seções';
  // Disable sections view for non-"Todos" tabs
  vb.style.display = (activeCategory === 'Todos') ? '' : 'none';
}

function renderContent() {
  destroySortables();
  const el = document.getElementById('content');
  el.innerHTML = '';

  if (activeCategory === 'Mais Visitados') {
    const top = [...state.sites].filter(s => s.visits > 0).sort((a,b) => b.visits - a.visits).slice(0,12);
    if (!top.length) {
      el.innerHTML = '<div class="empty"><div class="empty-icon">🏆</div>Nenhum site visitado ainda.<br>Clique nos cards para começar!</div>';
      return;
    }
    el.appendChild(buildGrid(top, true));
    return;
  }

  if (viewMode === 'sections' && activeCategory === 'Todos') {
    renderSections(el);
    return;
  }

  const filtered = activeCategory === 'Todos'
    ? state.sites
    : state.sites.filter(s => s.cat === activeCategory);

  const grid = buildGrid(filtered, activeCategory !== 'Todos');
  el.appendChild(grid);
}

function renderSections(el) {
  const cats = [...new Set(state.sites.map(s => s.cat).filter(Boolean))];
  cats.forEach(cat => {
    const sites = state.sites.filter(s => s.cat === cat);
    if (!sites.length) return;

    const sec = document.createElement('div');
    sec.className = 'sec-wrap';
    sec.dataset.cat = cat;

    const hd = document.createElement('div');
    hd.className = 'sec-header';
    hd.innerHTML = `<span class="sec-name">${cat}</span><span class="sec-arrow">▾</span>`;
    hd.onclick = () => {
      sec.classList.toggle('sec-collapsed');
    };

    const grid = buildGrid(sites, true);
    sec.appendChild(hd);
    sec.appendChild(grid);
    el.appendChild(sec);
  });
}

function buildGrid(sites, withDrag) {
  const grid = document.createElement('div');
  grid.className = 'grid';

  sites.forEach((site, i) => {
    grid.appendChild(buildCard(site, i));
  });

  // Add card button
  const addC = document.createElement('div');
  addC.className = 'add-card';
  addC.innerHTML = `<div class="add-icon">+</div><span>Adicionar</span>`;
  addC.onclick = () => openModal(null);
  grid.appendChild(addC);

  if (withDrag && typeof Sortable !== 'undefined') {
    const sortable = Sortable.create(grid, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      dragClass: 'sortable-drag',
      filter: '.add-card',
      onEnd: (evt) => {
        if (evt.oldIndex === evt.newIndex) return;
        const cards = [...grid.querySelectorAll('.site-card[data-id]')];
        const orderedIds = cards.map(c => c.dataset.id);
        reorderSites(orderedIds, sites);
      }
    });
    activeSortables.push(sortable);
  }

  return grid;
}

function buildCard(site, idx) {
  const card = document.createElement('div');
  card.className = 'site-card' + (site.favorite ? ' favorite' : '');
  card.dataset.id = site.id;
  card.style.setProperty('--i', idx);

  // Favicon
  const fav = buildFavicon(site, site.favorite ? 36 : 32);
  card.appendChild(fav);

  // Name
  const nameEl = document.createElement('span');
  nameEl.className = 'site-name';
  nameEl.textContent = site.name;
  nameEl.title = site.url;
  card.appendChild(nameEl);

  // Visit badge
  if (site.visits > 0) {
    const vb = document.createElement('span');
    vb.className = 'visit-badge has-visits';
    vb.textContent = site.visits > 99 ? '99+' : site.visits;
    card.appendChild(vb);
  }

  // Action buttons
  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const starBtn = document.createElement('button');
  starBtn.className = 'ca-btn ca-star' + (site.favorite ? ' starred' : '');
  starBtn.title = site.favorite ? 'Remover destaque' : 'Destacar';
  starBtn.textContent = '★';
  starBtn.onclick = e => { e.stopPropagation(); toggleFavorite(site.id); };

  const editBtn = document.createElement('button');
  editBtn.className = 'ca-btn ca-edit';
  editBtn.title = 'Editar';
  editBtn.textContent = '✏';
  editBtn.onclick = e => { e.stopPropagation(); openModal(site.id); };

  const delBtn = document.createElement('button');
  delBtn.className = 'ca-btn ca-del';
  delBtn.title = 'Remover';
  delBtn.textContent = '✕';
  delBtn.onclick = e => { e.stopPropagation(); removeSite(site.id); };

  actions.appendChild(starBtn);
  actions.appendChild(editBtn);
  actions.appendChild(delBtn);
  card.appendChild(actions);

  card.onclick = () => openSite(site);

  return card;
}

function destroySortables() {
  activeSortables.forEach(s => { try { s.destroy(); } catch(e) {} });
  activeSortables = [];
}

function reorderSites(orderedIds, subset) {
  // Get original indices of the subset in state.sites
  const indices = subset.map(s => state.sites.indexOf(s));
  indices.sort((a,b) => a-b);
  const reordered = orderedIds.map(id => state.sites.find(s => s.id === id)).filter(Boolean);
  indices.forEach((origIdx, i) => { state.sites[origIdx] = reordered[i]; });
  saveState();
}

/* ══════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════ */
function openSite(site) {
  site.visits = (site.visits || 0) + 1;
  saveState();
  const url = site.url.startsWith('http') ? site.url : 'https://'+site.url;
  window.open(url, '_blank');
}

function removeSite(id) {
  state.sites = state.sites.filter(s => s.id !== id);
  saveState();
  renderTabs();
  renderContent();
  showToast('Site removido');
}

function toggleFavorite(id) {
  const s = state.sites.find(x => x.id === id);
  if (s) { s.favorite = !s.favorite; saveState(); renderContent(); }
}

/* ══════════════════════════════════════════
   MODAL
══════════════════════════════════════════ */
function openModal(id) {
  editingId = id;
  document.getElementById('modalTitle').textContent = id ? 'Editar site' : 'Adicionar site';

  if (id) {
    const s = state.sites.find(x => x.id === id);
    document.getElementById('fName').value = s.name;
    document.getElementById('fUrl').value = s.url;
    document.getElementById('fCat').value = s.cat || '';
  } else {
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
    document.getElementById('fCat').value = '';
  }

  // Category chips
  const chips = document.getElementById('catChips');
  chips.innerHTML = '';
  const cats = [...new Set(state.sites.map(s => s.cat).filter(Boolean))];
  cats.forEach(cat => {
    const c = document.createElement('div');
    c.className = 'cat-chip';
    c.textContent = cat;
    c.onclick = () => { document.getElementById('fCat').value = cat; };
    chips.appendChild(c);
  });

  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 50);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function saveModal() {
  let name = document.getElementById('fName').value.trim();
  let url  = document.getElementById('fUrl').value.trim();
  let cat  = document.getElementById('fCat').value.trim() || 'Outros';
  if (!name || !url) { showToast('⚠ Preencha o nome e a URL'); return; }
  if (!url.startsWith('http')) url = 'https://' + url;

  if (editingId) {
    const s = state.sites.find(x => x.id === editingId);
    if (s) { s.name = name; s.url = url; s.cat = cat; }
    showToast('Site atualizado ✓');
  } else {
    state.sites.push({ id: uid(), name, url, cat, visits: 0, favorite: false });
    showToast('Site adicionado ✓');
  }

  saveState();
  closeModal();
  renderTabs();
  renderContent();
}

/* ══════════════════════════════════════════
   SEARCH
══════════════════════════════════════════ */
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  // Check if it looks like a URL
  if (/^(https?:\/\/|www\.)/.test(q)) {
    window.open(q.startsWith('http') ? q : 'https://'+q, '_blank');
  } else {
    window.open(searchEngine + encodeURIComponent(q), '_blank');
  }
  closeSuggestions();
}

function setEngine(btn, url) {
  document.querySelectorAll('.eng-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  searchEngine = url;
}

function updateSuggestions() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const box = document.getElementById('suggestions');
  sugFocus = -1;

  if (!q || q.length < 1) { closeSuggestions(); return; }

  const matches = state.sites
    .filter(s => s.name.toLowerCase().includes(q) || getDomain(s.url).includes(q))
    .sort((a,b) => b.visits - a.visits)
    .slice(0, 6);

  if (!matches.length) { closeSuggestions(); return; }

  box.innerHTML = '';
  matches.forEach(site => {
    const item = document.createElement('div');
    item.className = 'sug-item';
    const fav = buildFaviconSmall(site);
    const info = document.createElement('div');
    info.className = 'sug-info';
    info.innerHTML = `<div class="sug-name">${site.name}</div><div class="sug-url">${getDomain(site.url)}</div>`;
    const vis = document.createElement('span');
    vis.className = 'sug-visits';
    if (site.visits) vis.textContent = site.visits + ' visitas';
    item.appendChild(fav);
    item.appendChild(info);
    item.appendChild(vis);
    item.onmousedown = (e) => { e.preventDefault(); openSite(site); closeSuggestions(); };
    box.appendChild(item);
  });

  box.classList.add('show');
}

function closeSuggestions() {
  document.getElementById('suggestions').classList.remove('show');
  document.getElementById('suggestions').innerHTML = '';
}

function handleSearchKey(e) {
  const box = document.getElementById('suggestions');
  const items = box.querySelectorAll('.sug-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); sugFocus = Math.min(sugFocus+1, items.length-1); highlightSug(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); sugFocus = Math.max(sugFocus-1, -1); highlightSug(items); }
  else if (e.key === 'Enter') {
    if (sugFocus >= 0 && items[sugFocus]) { items[sugFocus].onmousedown(new MouseEvent('')); }
    else doSearch();
  } else if (e.key === 'Escape') closeSuggestions();
}

function highlightSug(items) {
  items.forEach((it, i) => { it.style.background = i === sugFocus ? 'var(--ag)' : ''; });
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-field-wrap')) closeSuggestions();
});

/* ══════════════════════════════════════════
   VIEW TOGGLE
══════════════════════════════════════════ */
function toggleView() {
  viewMode = viewMode === 'grid' ? 'sections' : 'grid';
  renderTabs();
  renderContent();
}

/* ══════════════════════════════════════════
   SETTINGS DRAWER
══════════════════════════════════════════ */
function toggleDrawer() {
  const open = document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawerOverlay').classList.toggle('open', open);
  if (open) updateStats();
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}

function setTheme(t) {
  state.settings.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('btnDark').classList.toggle('active', t === 'dark');
  document.getElementById('btnLight').classList.toggle('active', t === 'light');
  saveState();
}

function setWp(el) {
  const wp = el.dataset.wp;
  state.settings.wp = wp;
  document.documentElement.setAttribute('data-wp', wp);
  document.querySelectorAll('.wp-swatch').forEach(s => s.classList.toggle('active', s.dataset.wp === wp));
  saveState();
}

function updateStats() {
  const total = state.sites.length;
  const totalVisits = state.sites.reduce((s,x) => s + (x.visits||0), 0);
  const cats = new Set(state.sites.map(s => s.cat)).size;
  const favs = state.sites.filter(s => s.favorite).length;
  const top = [...state.sites].sort((a,b) => (b.visits||0)-(a.visits||0))[0];
  document.getElementById('statsBox').innerHTML = `
    <div class="dw-stat-row"><span>Sites cadastrados</span><span class="dw-stat-val">${total}</span></div>
    <div class="dw-stat-row"><span>Categorias</span><span class="dw-stat-val">${cats}</span></div>
    <div class="dw-stat-row"><span>Favoritos</span><span class="dw-stat-val">${favs}</span></div>
    <div class="dw-stat-row"><span>Total de acessos</span><span class="dw-stat-val">${totalVisits}</span></div>
    ${top && top.visits ? `<div class="dw-stat-row"><span>Mais acessado</span><span class="dw-stat-val" style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${top.name}">${top.name}</span></div>` : ''}
  `;
}

/* ══════════════════════════════════════════
   IMPORT / EXPORT
══════════════════════════════════════════ */
function exportData() {
  const json = JSON.stringify({sites: state.sites, exportedAt: new Date().toISOString()}, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'minha-pagina-backup.json';
  a.click();
  showToast('Exportado com sucesso ✓');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.sites)) throw new Error('Formato inválido');
      state.sites = data.sites.map(s => ({visits:0,favorite:false,...s,id: s.id||uid()}));
      saveState();
      renderTabs();
      renderContent();
      closeDrawer();
      showToast('Importado com sucesso ✓');
    } catch(err) {
      showToast('⚠ Arquivo inválido');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function resetData() {
  if (!confirm('Restaurar os sites padrão? Todos os seus sites serão perdidos.')) return;
  state.sites = DEFAULTS.map(s => ({...s, id: uid(), visits: 0, favorite: false}));
  saveState();
  renderTabs();
  renderContent();
  closeDrawer();
  showToast('Restaurado ✓');
}

/* ══════════════════════════════════════════
   WEATHER
══════════════════════════════════════════ */
const WMO = {
  0:'☀️', 1:'🌤', 2:'⛅', 3:'☁️',
  45:'🌫', 48:'🌫',
  51:'🌦', 53:'🌦', 55:'🌧',
  61:'🌧', 63:'🌧', 65:'🌧',
  71:'🌨', 73:'❄️', 75:'❄️',
  80:'🌧', 81:'🌧', 82:'⛈',
  95:'⛈', 96:'⛈', 99:'⛈',
};

async function loadWeather() {
  const el = document.getElementById('weather');
  el.classList.add('loading');
  if (!navigator.geolocation) { el.classList.remove('loading'); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const {latitude:lat, longitude:lon} = pos.coords;
      const [wRes, gRes] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`),
        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=pt`),
      ]);
      const [w, g] = await Promise.all([wRes.json(), gRes.json()]);
      const temp = Math.round(w.current_weather.temperature);
      const icon = WMO[w.current_weather.weathercode] || '🌡';
      const city = g.address?.city || g.address?.town || g.address?.village || '';
      el.classList.remove('loading');
      el.textContent = `${icon} ${temp}°C${city ? ' · '+city : ''}`;
    } catch(e) {
      el.classList.remove('loading');
    }
  }, () => { el.classList.remove('loading'); });
}

/* ══════════════════════════════════════════
   CLOCK
══════════════════════════════════════════ */
function updateClock() {
  const d = new Date();
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
}

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ══════════════════════════════════════════
   KEYBOARD SHORTCUTS
══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeDrawer(); closeSuggestions(); }
  if ((e.ctrlKey||e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
    document.getElementById('searchInput').select();
  }
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

document.getElementById('fCat').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveModal();
});

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
(function init() {
  // Apply saved settings
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'dark');
  document.documentElement.setAttribute('data-wp', state.settings.wp || 'void');

  // Sync drawer UI
  document.getElementById('btnDark').classList.toggle('active', state.settings.theme !== 'light');
  document.getElementById('btnLight').classList.toggle('active', state.settings.theme === 'light');
  document.querySelectorAll('.wp-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.wp === (state.settings.wp || 'void'));
  });

  renderTabs();
  renderContent();
  updateClock();
  setInterval(updateClock, 10000);
  loadWeather();
})();
</script>
